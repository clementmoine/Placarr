# Un seul compose — profiles pour les modes :
#
#   docker compose up -d                    # db + flaresolverr (hybride Mac)
#   docker compose --profile prod up -d     # + image placarr (Next + workers)
#   docker compose --profile dev up         # + Next/workers hot-reload en conteneurs
#
# Mac quotidien : `docker compose up -d` puis `pnpm dev`.
# `dev` est lent sous VirtioFS — préférer l'hybride sauf besoin de logs séparés.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: placarr-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-placarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placarr}
      POSTGRES_DB: ${POSTGRES_DB:-placarr}
    ports:
      # Loopback only — default password must not be LAN-reachable.
      - "127.0.0.1:5432:5432"
    volumes:
      - placarr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-placarr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # Chromium user-data must stay on tmpfs or /tmp grows tens of GB.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: placarr-flaresolverr
    ports:
      - "127.0.0.1:8191:8191"
    volumes:
      - placarr-flaresolverr-config:/config
    tmpfs:
      - /tmp:size=2g,mode=1777
    restart: unless-stopped
    logging: *default-logging

  # Prod all-in-one: Next + background workers (init.sh).
  # Secrets empty at parse time so `compose up -d` (db+flare) works without
  # them; the app still refuses to boot if they are missing at runtime.
  placarr:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: placarr:latest
    container_name: placarr
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-placarr}:${POSTGRES_PASSWORD:-placarr}@db:5432/${POSTGRES_DB:-placarr}
      - WORKER_CONCURRENCY=6
      - WORKER_ICOLLECT_CONCURRENCY=1
      - ENABLE_WORKERS=1
      - ENABLE_ICOLLECT_WORKER=1
      - ENABLE_TITLE_IDF_BUILD=1
      - ENABLE_TITLE_IDF_REFRESH=0
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@placarr.com}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ${ROOT:-.}/data:/app/data
    restart: unless-stopped
    logging: *default-logging

  # Full-docker hot-reload (rare on Mac — prefer hybrid).
  app:
    profiles: ["dev"]
    image: node:23.11.0-bookworm-slim
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm prisma generate &&
             pnpm prisma migrate deploy &&
             pnpm exec next dev -H 0.0.0.0"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-placarr}:${POSTGRES_PASSWORD:-placarr}@db:5432/${POSTGRES_DB:-placarr}
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - .:/app
      - placarr-dev-node-modules:/app/node_modules
      - placarr-dev-next:/app/.next
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ["dev"]
    image: node:23.11.0-bookworm-slim
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm prisma generate &&
             pnpm worker:dev"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-placarr}:${POSTGRES_PASSWORD:-placarr}@db:5432/${POSTGRES_DB:-placarr}
      - WORKER_ID=dev-worker-1
      - WORKER_KINDS=interactive
      - WORKER_CONCURRENCY=6
    volumes:
      - .:/app
      - placarr-dev-node-modules:/app/node_modules
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  worker-icollect:
    profiles: ["dev"]
    image: node:23.11.0-bookworm-slim
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm prisma generate &&
             pnpm worker:icollect:dev"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-placarr}:${POSTGRES_PASSWORD:-placarr}@db:5432/${POSTGRES_DB:-placarr}
      - WORKER_ID=dev-worker-icollect
      - WORKER_KINDS=catalog
      - WORKER_CONCURRENCY=1
    volumes:
      - .:/app
      - placarr-dev-node-modules:/app/node_modules
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  placarr-db:
  placarr-flaresolverr-config:
    # Created before compose ownership; keep content across recreate.
    name: placarr_placarr-flaresolverr-config
    external: true
  placarr-dev-node-modules:
  placarr-dev-next:
