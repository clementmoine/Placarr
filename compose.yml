services:
  db:
    image: postgres:16-alpine
    container_name: placarr-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-placarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placarr}
      POSTGRES_DB: ${POSTGRES_DB:-placarr}
    ports:
      # Exposé sur l'hôte pour le dev local (next dev sur le Mac), mais lié à
      # la loopback : sans ça la base est jointe depuis tout le réseau, avec le
      # mot de passe par défaut.
      - "127.0.0.1:5432:5432"
    volumes:
      - placarr-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-placarr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Single image: Next + interactive worker + iCollect worker (init.sh).
  placarr:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: placarr:latest
    container_name: placarr
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-placarr}:${POSTGRES_PASSWORD:-placarr}@db:5432/${POSTGRES_DB:-placarr}
      - WORKER_CONCURRENCY=6
      - WORKER_ICOLLECT_CONCURRENCY=1
      - ENABLE_WORKERS=1
      - ENABLE_ICOLLECT_WORKER=1
      - ENABLE_TITLE_IDF_BUILD=1
      - ENABLE_TITLE_IDF_REFRESH=0
      # - TITLE_IDF_REFRESH_SECONDS=86400
      # Obligatoire : l'app refuse de démarrer sans. `openssl rand -base64 32`.
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:?définis NEXTAUTH_SECRET dans .env (openssl rand -base64 32)}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@placarr.com}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      # Pas de valeur par défaut : une instance exposée avec « admin » est une
      # instance compromise. Le seed tourne au boot et crée ce compte.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?définis ADMIN_PASSWORD dans .env}
      - GUEST_EMAIL=${GUEST_EMAIL:-guest@placarr.com}
      - GUEST_NAME=${GUEST_NAME:-Guest}
      - GUEST_PASSWORD=${GUEST_PASSWORD:?définis GUEST_PASSWORD dans .env}
      #- AVES_API_KEY=
      #- DATA_FOR_SEO_API_KEY=
      #- RAWG_API_KEY=
      #- STEAMGRIDDB_API_KEY=
      #- TMDB_API_KEY=
    volumes:
      # Runtime data: uploads, foil packs, provider indexes (never in the image).
      - ${ROOT:-.}/data:/app/data
    restart: unless-stopped

volumes:
  placarr-db:
