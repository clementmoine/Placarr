# Un seul compose — profiles pour les modes :
#
#   docker compose up -d --build            # db + byparr (hybride Mac)
#   docker compose --profile prod up -d     # + image placarr (Next + workers)
#   docker compose --profile dev up         # + Next/workers hot-reload en conteneurs
#
# Mac quotidien : `docker compose up -d` puis `pnpm dev`.
# `dev` est lent sous VirtioFS — préférer l'hybride sauf besoin de logs séparés.

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: placarr-db
    ports:
      # Loopback only — default password must not be LAN-reachable.
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-placarr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-placarr}
      POSTGRES_DB: ${POSTGRES_DB:-placarr}
      # Fresh (empty) volume → restore the newest dump from /backups.
      RESTORE_ON_INIT: ${RESTORE_ON_INIT:-1}
    volumes:
      # Live data stays in a Docker volume on purpose: a running cluster must
      # never sit in a synced folder (Synology Drive/iCloud/Dropbox break
      # fsync and copy torn files), and the volume is the fast path on macOS.
      # Durability comes from the dumps below, not from this volume.
      - placarr-db:/var/lib/postgresql/data
      - ./docker/postgres/initdb:/docker-entrypoint-initdb.d:ro
      - ${PLACARR_BACKUP_DIR:-./backups/postgres}:/backups:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-placarr}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    logging: *default-logging

  # pg_dump every BACKUP_INTERVAL_SECONDS into ./backups/postgres (synced to
  # the NAS). `pnpm db:backup` / `pnpm db:restore` — see docs/database.md.
  db-backup:
    image: postgres:16-alpine
    container_name: placarr-db-backup
    entrypoint: ["/bin/sh", "/scripts/backup.sh", "loop"]
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-placarr}
      PGPASSWORD: ${POSTGRES_PASSWORD:-placarr}
      PGDATABASE: ${POSTGRES_DB:-placarr}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-21600}
      BACKUP_KEEP_ALL_DAYS: ${BACKUP_KEEP_ALL_DAYS:-7}
      BACKUP_KEEP_DAILY_DAYS: ${BACKUP_KEEP_DAILY_DAYS:-35}
      BACKUP_KEEP_MONTHLY_DAYS: ${BACKUP_KEEP_MONTHLY_DAYS:-365}
    volumes:
      - ./docker/postgres:/scripts:ro
      - ${PLACARR_BACKUP_DIR:-./backups/postgres}:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  # Byparr (Camoufox) — FlareSolverr-compatible /v1 + Placarr downloadUrls patch.
  # shm + tmpfs recommended by upstream; leave /cache on the image (baked browser).
  byparr:
    build:
      context: ./docker/byparr
      dockerfile: Dockerfile
    image: placarr-byparr:download
    container_name: placarr-byparr
    ports:
      - "127.0.0.1:8191:8191"
    environment:
      BROWSER_LOCALE: ${BYPARR_BROWSER_LOCALE:-fr-FR}
      BROWSER_TIMEZONE: ${BYPARR_BROWSER_TIMEZONE:-Europe/Paris}
    shm_size: "1gb"
    tmpfs:
      - /tmp:exec,mode=1777,size=1G
    restart: unless-stopped
    logging: *default-logging

  # Prod all-in-one: Next + background workers (init.sh).
  # Secrets empty at parse time so `compose up -d` (db+byparr) works without
  # them; the app still refuses to boot if they are missing at runtime.
  placarr:
    profiles: ["prod"]
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: placarr:latest
    container_name: placarr
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-placarr}:${POSTGRES_PASSWORD:-placarr}@db:5432/${POSTGRES_DB:-placarr}
      - WORKER_CONCURRENCY=6
      - WORKER_CATALOG_CONCURRENCY=1
      - ENABLE_WORKERS=1
      - ENABLE_CATALOG_WORKER=1
      - ENABLE_TITLE_IDF_BUILD=1
      - ENABLE_TITLE_IDF_REFRESH=0
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - ADMIN_EMAIL=${ADMIN_EMAIL:-admin@placarr.com}
      - ADMIN_NAME=${ADMIN_NAME:-Admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
    volumes:
      - ${ROOT:-.}/data:/app/data
    restart: unless-stopped
    logging: *default-logging

  # Full-docker hot-reload (rare on Mac — prefer hybrid).
  app:
    profiles: ["dev"]
    image: node:23.11.0-bookworm-slim
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm prisma generate &&
             pnpm prisma migrate deploy &&
             pnpm exec next dev -H 0.0.0.0"
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-placarr}:${POSTGRES_PASSWORD:-placarr}@db:5432/${POSTGRES_DB:-placarr}
      - NEXTAUTH_URL=http://localhost:3000
    volumes:
      - .:/app
      - placarr-dev-node-modules:/app/node_modules
      - placarr-dev-next:/app/.next
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy

  worker:
    profiles: ["dev"]
    image: node:23.11.0-bookworm-slim
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm prisma generate &&
             pnpm worker:dev"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-placarr}:${POSTGRES_PASSWORD:-placarr}@db:5432/${POSTGRES_DB:-placarr}
      - WORKER_ID=dev-worker-1
      - WORKER_KINDS=interactive
      - WORKER_CONCURRENCY=6
    volumes:
      - .:/app
      - placarr-dev-node-modules:/app/node_modules
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  worker-catalog:
    profiles: ["dev"]
    image: node:23.11.0-bookworm-slim
    working_dir: /app
    command: >
      sh -c "corepack enable &&
             pnpm install --frozen-lockfile &&
             pnpm prisma generate &&
             pnpm worker:catalog:dev"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-placarr}:${POSTGRES_PASSWORD:-placarr}@db:5432/${POSTGRES_DB:-placarr}
      - WORKER_ID=dev-worker-catalog
      - WORKER_KINDS=catalog
      - WORKER_CONCURRENCY=1
    volumes:
      - .:/app
      - placarr-dev-node-modules:/app/node_modules
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

volumes:
  # Fixed name so a project-directory rename never orphans the database.
  placarr-db:
    name: placarr-db
  placarr-dev-node-modules:
  placarr-dev-next:
